# Settings for launch.sh (sourced by bash). Edit per experiment.

# GPU sizes to try, in order. launch.sh falls back to the next one when a size
# has no capacity. NVIDIA sizes only (they share the image below).
SIZES="gpu-l40sx1-48gb gpu-6000adax1-48gb gpu-h100x1-80gb"
REGIONS="tor1 nyc2 ams3 atl1"
IMAGE=gpu-h100x1-base
SSH_KEY_ID=60418976          # DigitalOcean key "RSI 2" (~/.ssh/id_ed25519)

# Hard cap on the box's life. progress() in the experiment can only pull the
# deadline in, never push it out.
DEADLINE_HOURS=6

# Minutes to keep the box alive after the experiment succeeds (0 = destroy at
# once, after the final results push). Raise it only if a session will inspect it.
KEEP_AFTER_DONE_MIN=0

PIP_PACKAGES="torch numpy"
